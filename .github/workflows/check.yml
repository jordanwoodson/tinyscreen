name: ✅ Check

# Pull requests (Renovate's dependency updates among them) run the same tests, lint and minified
# release build as a release does. The APK is signed with the debug key and nothing is published;
# no secrets are used.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  check:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🛡️ Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: ⚙️ Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-read-only: true # the release workflow on main owns the cache

      - name: 🤖📦 Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease

      - name: 📋 Keep the test and lint reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: app/build/reports/
          retention-days: 14
