name: Playback on Android
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      public_youtube:
        description: Also check playback against YouTube
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
          cache-read-only: true
      - run: ./gradlew :app:assembleSmoke
      - if: inputs.public_youtube
        run: ./gradlew :app:assembleRelease
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          ram-size: 2048M
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            python3 scripts/test-playback.py
            if [ -f app/build/outputs/apk/release/app-release.apk ]; then adb -e install -r app/build/outputs/apk/release/app-release.apk && python3 scripts/test-playback.py --public-youtube; fi
