name: 📦🚀 Release

# Every push to main that changes the app publishes a signed APK as a new GitHub release,
# which Obtainium picks up as an update. Versions are assigned here: don't bump
# version_name/version_code or push tags by hand.
on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/release.yml"
  workflow_dispatch:

# Queue releases so two pushes can't claim the same version number
concurrency:
  group: release
  cancel-in-progress: false

# Read-only by default. Only the publish job, which runs no project code, can write to the repo.
permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

env:
  # Tinyscreen release certificate; Android refuses updates signed with any other key
  CERT_SHA256: 39752f6c8f3cd92ecd3dd79261c739ed3a7fb3ba057ed763ab076e1a401dd5ff

jobs:
  build:
    name: Build and sign
    # Releases only come from main, also when the workflow is started by hand
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tags and history for the version number and notes
          persist-credentials: false # keep the token out of .git/config, away from Gradle plugins

      - name: 🛡️ Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: ⚙️ Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: 📌 Assign the next version
        id: version
        run: scripts/next-version.sh --write # 1.0.N; see the script for the version code scheme

      - name: 🧪 Test and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease

      # The keystore and key.properties exist only while this step runs, and the secrets never
      # reach the Gradle process's environment.
      - name: 🤖📦 Build the signed APK
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/tinyscreen-release.jks"
          trap 'rm -f "$KEYSTORE_FILE" key.properties' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_FILE_BASE64" | base64 -d > "$KEYSTORE_FILE")
          python3 scripts/write-signing-properties.py
          unset KEYSTORE_FILE_BASE64 KEYSTORE_ALIAS KEYSTORE_PASSWORD KEY_PASSWORD
          # A single-use daemon, so the passwords don't stay in a Gradle process after the build
          ./gradlew --no-daemon :app:assembleRelease

      - name: 🧹 Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tinyscreen-release.jks" key.properties

      - name: 🔏 Check the signature and name the APK
        working-directory: app/build/outputs/apk/release
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs app-release.apk)
          grep -qi "SHA-256 digest: $CERT_SHA256" <<< "$certs" \
            || { echo "::error::APK is not signed with the Tinyscreen release key"; exit 1; }
          mkdir -p "$RUNNER_TEMP/dist"
          cp app-release.apk "$RUNNER_TEMP/dist/tinyscreen-v$VERSION.apk"
          cd "$RUNNER_TEMP/dist"
          sha256sum "tinyscreen-v$VERSION.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 📝 Write the release notes
        run: |
          {
            if [ -n "$LAST_TAG" ]; then
              git log --no-merges --format='- %s' "$LAST_TAG"..HEAD
            else
              git log --no-merges --format='- %s'
            fi
            echo
            echo "Built from $GITHUB_SHA (version code $VERSION_CODE)."
          } > "$RUNNER_TEMP/dist/notes.md"
          cat "$RUNNER_TEMP/dist/notes.md"

      - name: ⬆️ Hand the APK to the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

      # Turns obfuscated stack traces from this release back into readable ones (R8 retrace)
      - name: 🗺️ Keep the R8 mapping
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-mapping-v${{ steps.version.outputs.version }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish the GitHub release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the v1.0.N tag and the release
    steps:
      - name: ⬇️ Download the APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist

      - name: 🚀 Publish the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check SHA256SUMS.txt
          gh release create "v$VERSION" "tinyscreen-v$VERSION.apk" SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest \
            --title "Tinyscreen $VERSION" \
            --notes-file notes.md
